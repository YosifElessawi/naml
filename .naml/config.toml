# naml config for the naml source repo itself.
#
# Naml is being prepared to dogfood the V2 flow on its own codebase once
# Phase 5 (state machines) lands. This config lets the upcoming UI sprint
# (.naml/sprints/2026-05-19-cockpit-v2/) execute against this repo.

[repo]
slug        = "YosifElessawi/naml"
base_branch = "main"


[paths]
sprints_dir    = ".naml/sprints"
feedback_inbox = "docs/feedback/inbox.md"


# Single-lane to start — first self-host run should be conservative.
# Bump to 3 once dogfood is healthy.
[lanes]
default = 1
max     = 4


[labels]
ready      = "ready-for-agent"
running    = "agent-running"
done       = "agent-done"
failed     = "agent-failed"
needs_info = "needs-info"


# Symlink these repo-root paths into each new lane's worktree so gates can
# find gitignored binaries (biome, tsc, vitest) without a per-lane
# `pnpm install`. Default is just `.venv`; slice-11 added
# `web/node_modules` after the `web-lint` gate failed with
# `biome: command not found`. The lockfile isn't committed yet, so
# symlinking from the source checkout is the only zero-install path.
# Missing sources are silently skipped at worktree-creation time, so
# the list is safe on machines that don't have one or the other.
[worktree]
symlinks = [".venv", "web/node_modules"]


# Gate commands. naml's Python runtime stays close to stdlib (aiohttp is the
# one runtime dep); tests run via stdlib `unittest discover` — no pytest
# install required, and `python3` because macOS doesn't ship a bare `python`.
# web/ is a TS tier with its own lint/typecheck/test gates.
[[gates]]
name = "test"
argv = ["python3", "-m", "unittest", "discover", "-s", "tests"]

# Each web gate ensures node_modules is present before running. Worktrees
# start without a node_modules (it's gitignored and not in the [worktree]
# symlink list), so the lane's first web-gate invocation in a fresh
# worktree installs from the committed pnpm-lock.yaml. Subsequent gates
# in the same worktree skip the install (the test -d short-circuit).
[[gates]]
name = "web-lint"
argv = ["sh", "-c", "cd web && { [ -d node_modules ] || pnpm install --frozen-lockfile --silent; } && pnpm lint"]

[[gates]]
name = "web-typecheck"
argv = ["sh", "-c", "cd web && { [ -d node_modules ] || pnpm install --frozen-lockfile --silent; } && pnpm typecheck"]

[[gates]]
name = "web-test"
argv = ["sh", "-c", "cd web && { [ -d node_modules ] || pnpm install --frozen-lockfile --silent; } && pnpm test --run"]


[run]
# Bumped from 45 → 75 for the cockpit sprint: slice-1 stands up Vite +
# pnpm + aiohttp + gates (heavy), and UI slices iterate on layout +
# tests. 45 was right for the count-with-filter mock; 75 is the cockpit
# realistic ceiling. Dial back after the first self-host run if it's
# wasteful.
cap_minutes = 75
max_retries = 2


[pipeline]
# Safe default for first self-host runs — open PRs, never auto-merge.
# Flip to "review" once we trust the gates, then "merge" once we trust
# the tiered merger end-to-end.
stop_after  = "pr"
auto_review = false


[claude]
bin        = "claude"
# Use the higher-limit work account for self-host runs.
config_dir = "~/.claude"
